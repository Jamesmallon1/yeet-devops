global:
  scrape_interval: 10s

scrape_configs:
  - job_name: backend
    static_configs: [{ targets: ["127.0.0.1:9464"] }]
  - job_name: node-monolith
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
  - job_name: cloudflared
    static_configs: [{ targets: ["127.0.0.1:2000"] }]
  - job_name: node-timescale
    static_configs: [{ targets: ["10.10.1.20:9100"] }]
  - job_name: postgres-timescale
    static_configs: [{ targets: ["10.10.1.20:9187"] }]
