services:
  timescale:
    image: timescale/timescaledb-ha:pg17
    container_name: timescale
    restart: unless-stopped
    # Bind ONLY to the private network IP. Never the public interface.
    ports:
      - "${PRIVATE_IP}:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      TS_INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      TS_API_PASSWORD: ${API_PASSWORD}
      MONOLITH_IP: ${MONOLITH_IP}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - /var/lib/yeet/timescale:/home/postgres/pgdata
      - /opt/yeet/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - /opt/yeet/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - /opt/yeet/init:/docker-entrypoint-initdb.d:ro
    shm_size: 2g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "${PRIVATE_IP}:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${SUPERUSER_PASSWORD}@timescale:5432/postgres?sslmode=disable"
    depends_on: [timescale]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=${PRIVATE_IP}:9100"]
    volumes:
      - /:/host:ro,rslave
